[project]
name = "insightiq-api"
version = "0.1.0"
description = "InsightIQ — Core REST API Service"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "python-multipart>=0.0.12",    # File uploads

    # --- Data Validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Database: PostgreSQL ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",             # Async PostgreSQL driver
    "alembic>=1.13.3",             # Database migrations
    "pgvector>=0.3.5",             # pgvector Python client

    # --- Analytics: DuckDB (local replacement for ClickHouse) ---
    "duckdb>=1.1.0",

    # --- Vector Database: Qdrant (optional — app degrades gracefully without it) ---
    "qdrant-client>=1.12.0",

    # --- Cache: Redis (optional — app degrades gracefully without it) ---
    "redis[hiredis]>=5.1.0",

    # --- AI / LLM ---
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",

    # --- HTTP Client (internal service calls) ---
    "httpx>=0.27.0",
    "tenacity>=9.0.0",             # Retry logic

    # --- Authentication ---
    "PyJWT[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",

    # --- Utilities ---
    "orjson>=3.10.7",              # Fast JSON serialization
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",

    # --- Observability ---
    "structlog>=24.4.0",           # Structured JSON logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",               # TestClient
    "factory-boy>=3.3.0",          # Test fixtures
    "ruff>=0.6.9",                 # Linting + formatting
    "mypy>=1.11.0",                # Type checking
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
