[project]
name = "insightiq-analytics-worker"
version = "0.1.0"
description = "InsightIQ — Analytics Worker (Forecasting, Anomaly Detection, ML)"
requires-python = ">=3.12"

dependencies = [
    # --- ML / Forecasting ---
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.5",
    "neuralforecast>=2.0.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
    "dowhy>=0.11.0",         # Causal inference

    # --- Data ---
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "pyarrow>=17.0.0",

    # --- Database ---
    "clickhouse-connect>=0.8.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.1.0",

    # --- Feature Store (Feast) ---
    "feast>=0.41.0",

    # --- MLflow ---
    "mlflow>=2.17.0",

    # --- Validation & Config ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
