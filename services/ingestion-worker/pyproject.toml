[project]
name = "insightiq-ingestion-worker"
version = "0.1.0"
description = "InsightIQ — Ingestion Worker (NLP, Audio, Document Processing)"
requires-python = ">=3.12"

dependencies = [
    # --- NLP Pipeline ---
    "spacy>=3.8.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "sentence-transformers>=3.3.0",
    "bertopic>=0.16.4",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",

    # --- Audio ---
    "openai-whisper>=20231117",
    "pyannote.audio>=3.3.2",
    "librosa>=0.10.2",

    # --- Document Parsing ---
    "pypdf2>=3.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pillow>=11.0.0",

    # --- Embeddings ---
    "openai>=1.55.0",
    "qdrant-client>=1.12.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "clickhouse-connect>=0.8.0",
    "redis[hiredis]>=5.1.0",

    # --- Object Storage ---
    "boto3>=1.35.0",

    # --- Data ---
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # --- Config ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
