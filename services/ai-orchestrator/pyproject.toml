[project]
name = "insightiq-ai-orchestrator"
version = "0.1.0"
description = "InsightIQ — AI Orchestrator Service (LangGraph Multi-Agent)"
requires-python = ">=3.12"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",

    # --- Agent Framework ---
    "langgraph>=0.2.40",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "langchain-anthropic>=0.3.0",

    # --- LLM Providers ---
    "openai>=1.55.0",
    "anthropic>=0.40.0",

    # --- Vector Search ---
    "qdrant-client>=1.12.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.1.0",

    # --- ML Libraries ---
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",

    # --- Validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Utilities ---
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.7",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
