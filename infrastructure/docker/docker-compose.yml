# =============================================
# InsightIQ — Local Development Docker Compose
# Services: PostgreSQL, ClickHouse, Qdrant, Redis
#
# Usage:
#   cp .env.docker .env
#   docker-compose up -d
#   docker-compose ps       # verify all healthy
#   docker-compose logs -f  # stream logs
#   docker-compose down -v  # teardown + remove volumes
# =============================================

services:

  # ==========================================
  # PostgreSQL 16 — OLTP System of Record
  # + pgvector extension (MVP vector search)
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insightiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightiq}
      POSTGRES_USER: ${POSTGRES_USER:-insightiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightiq_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightiq_user} -d ${POSTGRES_DB:-insightiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - insightiq-network

  # ==========================================
  # ClickHouse 24 — OLAP Analytics Engine
  # ==========================================
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: insightiq-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-insightiq_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-insightiq_ch}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-insightiq_ch_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/custom_users.xml:ro
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - insightiq-network

  # ==========================================
  # Qdrant — Vector Database
  # Collections: documents, feedback, insights,
  #              metric_definitions, decisions,
  #              audio_transcripts
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: insightiq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - insightiq-network

  # ==========================================
  # Redis 7 — Cache, Sessions, Rate Limits
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: insightiq-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-insightiq_redis_dev_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-insightiq_redis_dev_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - insightiq-network

  # ==========================================
  # Redis Commander — Web UI for Redis
  # Available at: http://localhost:8081
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: insightiq-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-insightiq_redis_dev_password}"
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - insightiq-network
    profiles:
      - dev-tools  # Only start with: docker-compose --profile dev-tools up

  # ==========================================
  # pgAdmin 4 — PostgreSQL Web UI
  # Available at: http://localhost:5050
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: insightiq-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@insightiq.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insightiq-network
    profiles:
      - dev-tools  # Only start with: docker-compose --profile dev-tools up

# ==========================================
# Volumes — Persistent Data
# ==========================================
volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  insightiq-network:
    driver: bridge
    name: insightiq-network
