# =============================================
# Qdrant Configuration — Local Development
# =============================================

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  # Uncomment for production API key protection:
  # api_key: YOUR_QDRANT_API_KEY

storage:
  # On-disk storage path (mapped to Docker volume)
  storage_path: /qdrant/storage

  # HNSW index configuration
  hnsw_index:
    m: 16                  # Number of bi-directional links per element
    ef_construct: 100      # Size of the dynamic candidate list during construction
    full_scan_threshold: 10000  # Switch from HNSW to flat scan below this count

  # Quantization for memory efficiency (disable for MVP)
  # quantization:
  #   scalar:
  #     type: int8
  #     quantile: 0.99
  #     always_ram: true

log_level: INFO
